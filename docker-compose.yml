version: "3.9"

services:
  backend:
    build: ./backend
    container_name: aiops-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:///./aiops.db
      LLM_MODE: mock

  frontend:
    build: ./frontend
    container_name: aiops-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://127.0.0.1:8000
    depends_on:
      - backend
